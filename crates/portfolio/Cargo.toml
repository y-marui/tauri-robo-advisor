[package]
name = "portfolio"
version = "0.1.0"
description = "Portfolio model with validated edits: categories, products, accounts, holdings, and targets."
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
rust_decimal = { version = "1", features = ["macros"] }
