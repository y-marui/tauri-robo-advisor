[package]
name = "rebalance"
version = "0.1.0"
description = "Pure portfolio rebalancing calculation with exact decimal arithmetic."
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
rust_decimal = { version = "1", features = ["macros"] }
