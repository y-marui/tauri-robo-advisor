[package]
name = "tauri-robo-advisor"
version = "0.1.0"
description = "Cross-platform desktop app to aggregate brokerage assets and propose portfolio rebalancing."
authors.workspace = true
license.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_robo_advisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rebalance = { path = "../crates/rebalance" }
bitflyer = { path = "../crates/bitflyer" }
coincheck = { path = "../crates/coincheck" }
gmocoin = { path = "../crates/gmocoin" }
binance = { path = "../crates/binance" }
portfolio = { path = "../crates/portfolio" }
suggest = { path = "../crates/suggest" }
export = { path = "../crates/export" }
tabular = { path = "../crates/tabular" }
browser = { path = "../crates/browser" }
keyring = "4"
rust_decimal = "1"
tauri-plugin-window-state = "2"

[dev-dependencies]
